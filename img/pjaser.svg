<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="400" height="140" role="img" aria-labelledby="titel2 besk2">
  <title id="titel2">Illustration av schackpjäser</title>
  <desc id="besk2">Fem enkla illustrationer av schackpjäser: bonde, löpare, springare, torn och dam.</desc>
  <rect x="0" y="0" width="400" height="140" fill="#ece4cc"/>

  <!-- Bonde -->
  <g transform="translate(20,20)">
    <circle cx="20" cy="15" r="12" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <path d="M6 45 C6 28 34 28 34 45 L34 60 L6 60 Z" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <rect x="0" y="60" width="40" height="8" rx="2" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <text x="20" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b1a10">Bonde</text>
  </g>

  <!-- Löpare -->
  <g transform="translate(95,10)">
    <path d="M20 5 C28 12 30 24 20 32 C10 24 12 12 20 5 Z" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <path d="M8 50 C8 35 32 35 32 50 L32 64 L8 64 Z" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <rect x="2" y="64" width="36" height="8" rx="2" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <circle cx="20" cy="2" r="3" fill="#2b1a10"/>
    <text x="20" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b1a10">Löpare</text>
  </g>

  <!-- Springare -->
  <g transform="translate(170,15)">
    <path d="M8 55 L8 40 C8 22 18 10 32 10 C38 10 40 16 36 20 C32 24 30 20 26 22 C22 24 28 28 24 32 C20 36 14 30 12 36 C10 42 16 44 14 50 L14 55 Z" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <circle cx="28" cy="18" r="1.6" fill="#2b1a10"/>
    <rect x="2" y="55" width="36" height="8" rx="2" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <text x="20" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b1a10">Springare</text>
  </g>

  <!-- Torn -->
  <g transform="translate(250,18)">
    <rect x="0" y="0" width="34" height="10" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <rect x="3" y="10" width="6" height="8" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <rect x="14" y="10" width="6" height="8" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <rect x="25" y="10" width="6" height="8" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <path d="M3 18 C3 32 31 32 31 18 L31 48 L3 48 Z" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <rect x="-2" y="48" width="38" height="8" rx="2" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <text x="17" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b1a10">Torn</text>
  </g>

  <!-- Dam -->
  <g transform="translate(325,8)">
    <path d="M2 18 L8 2 L16 14 L20 0 L24 14 L32 2 L38 18 Z" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <path d="M4 18 C4 36 36 36 36 18 L36 58 L4 58 Z" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <rect x="-2" y="58" width="44" height="8" rx="2" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    <text x="20" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b1a10">Dam</text>
  </g>
</svg>
