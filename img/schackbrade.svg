<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="titel1 besk1">
  <title id="titel1">Illustration av ett schackbräde</title>
  <desc id="besk1">Ett 8x8 schackbräde i brunt och beige med en vit och en svart pjäs uppställda.</desc>
  <g>
    <!-- 8x8 bräde -->
    <g>
      <!-- bakgrund -->
      <rect x="0" y="0" width="320" height="320" fill="#6b3e26"/>
      <!-- rutor -->
      <g>
        <!-- genereras manuellt rad för rad -->
        <!-- rad 0 -->
        <rect x="0" y="0" width="40" height="40" fill="#f0e6c8"/>
        <rect x="80" y="0" width="40" height="40" fill="#f0e6c8"/>
        <rect x="160" y="0" width="40" height="40" fill="#f0e6c8"/>
        <rect x="240" y="0" width="40" height="40" fill="#f0e6c8"/>
        <!-- rad 1 -->
        <rect x="40" y="40" width="40" height="40" fill="#f0e6c8"/>
        <rect x="120" y="40" width="40" height="40" fill="#f0e6c8"/>
        <rect x="200" y="40" width="40" height="40" fill="#f0e6c8"/>
        <rect x="280" y="40" width="40" height="40" fill="#f0e6c8"/>
        <!-- rad 2 -->
        <rect x="0" y="80" width="40" height="40" fill="#f0e6c8"/>
        <rect x="80" y="80" width="40" height="40" fill="#f0e6c8"/>
        <rect x="160" y="80" width="40" height="40" fill="#f0e6c8"/>
        <rect x="240" y="80" width="40" height="40" fill="#f0e6c8"/>
        <!-- rad 3 -->
        <rect x="40" y="120" width="40" height="40" fill="#f0e6c8"/>
        <rect x="120" y="120" width="40" height="40" fill="#f0e6c8"/>
        <rect x="200" y="120" width="40" height="40" fill="#f0e6c8"/>
        <rect x="280" y="120" width="40" height="40" fill="#f0e6c8"/>
        <!-- rad 4 -->
        <rect x="0" y="160" width="40" height="40" fill="#f0e6c8"/>
        <rect x="80" y="160" width="40" height="40" fill="#f0e6c8"/>
        <rect x="160" y="160" width="40" height="40" fill="#f0e6c8"/>
        <rect x="240" y="160" width="40" height="40" fill="#f0e6c8"/>
        <!-- rad 5 -->
        <rect x="40" y="200" width="40" height="40" fill="#f0e6c8"/>
        <rect x="120" y="200" width="40" height="40" fill="#f0e6c8"/>
        <rect x="200" y="200" width="40" height="40" fill="#f0e6c8"/>
        <rect x="280" y="200" width="40" height="40" fill="#f0e6c8"/>
        <!-- rad 6 -->
        <rect x="0" y="240" width="40" height="40" fill="#f0e6c8"/>
        <rect x="80" y="240" width="40" height="40" fill="#f0e6c8"/>
        <rect x="160" y="240" width="40" height="40" fill="#f0e6c8"/>
        <rect x="240" y="240" width="40" height="40" fill="#f0e6c8"/>
        <!-- rad 7 -->
        <rect x="40" y="280" width="40" height="40" fill="#f0e6c8"/>
        <rect x="120" y="280" width="40" height="40" fill="#f0e6c8"/>
        <rect x="200" y="280" width="40" height="40" fill="#f0e6c8"/>
        <rect x="280" y="280" width="40" height="40" fill="#f0e6c8"/>
      </g>
      <rect x="0" y="0" width="320" height="320" fill="none" stroke="#2b1a10" stroke-width="4"/>
    </g>

    <!-- Vit kung på rad 7 -->
    <g transform="translate(150,255)">
      <circle cx="10" cy="4" r="5" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
      <rect x="6" y="-2" width="3" height="10" fill="#2b1a10"/>
      <rect x="2" y="2" width="11" height="3" fill="#2b1a10"/>
      <path d="M0 24 C0 12 20 12 20 24 L20 34 L0 34 Z" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
      <rect x="-4" y="34" width="28" height="7" rx="2" fill="#f5f1e8" stroke="#2b1a10" stroke-width="2"/>
    </g>

    <!-- Svart torn på rad 0 -->
    <g transform="translate(70,25)">
      <rect x="0" y="0" width="22" height="8" fill="#2b1a10"/>
      <rect x="2" y="8" width="5" height="6" fill="#2b1a10"/>
      <rect x="9" y="8" width="5" height="6" fill="#2b1a10"/>
      <rect x="16" y="8" width="5" height="6" fill="#2b1a10"/>
      <path d="M2 14 C2 24 20 24 20 14 L20 34 L2 34 Z" fill="#2b1a10"/>
      <rect x="-3" y="34" width="28" height="7" rx="2" fill="#2b1a10"/>
    </g>
  </g>
</svg>
